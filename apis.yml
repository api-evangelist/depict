aid: depict
name: Depict
description: >-
  Depict is an AI-assisted merchandising platform for e-commerce brands, headquartered in Stockholm,
  Sweden and backed by Slow Ventures and Y Combinator. Depict helps fashion and lifestyle retailers
  curate visual merchandising, hybrid AI-plus-keyword site search, and personalized product
  recommendations across their storefronts, automating routine merchandising and optimization while
  keeping brand rules intact. For developers, Depict exposes a public Storefront API (served from
  api.depict.ai) that returns search results, query suggestions, product listings, and
  recommendations and accepts tracking events, plus an Auth0-protected Portal API and a Lite API
  that power the merchant portal and the Depict Lite Shopify app. The platform integrates with
  Shopify, Centra, WooCommerce, and headless/composable storefronts through JavaScript and React UI
  libraries as well as direct REST API access.
url: https://raw.githubusercontent.com/api-evangelist/depict/refs/heads/main/apis.yml
