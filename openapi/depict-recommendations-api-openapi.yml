openapi: 3.2.0
info:
  title: Depict Recommendations API
  version: '1.0'
tags:
- name: Recommendations
paths:
  /v2/recommend/products/general:
    post:
      tags:
      - Recommendations
      summary: Recommend For User
      operationId: Recommend_for_User_v2_recommend_products_general_post
      parameters:
      - name: port
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Port
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneralRecommendRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/recommend/products/product:
