      summary: Recommend For Category And User
      operationId: Recommend_for_Category_and_User_v2_recommend_products_category_post
      parameters:
      - name: port
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Port
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRecommendRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
