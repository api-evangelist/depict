  /v3/get-displays:
    post:
      tags:
      - Recommendations
      summary: Get Displays Endpoint V3
      operationId: get_displays_endpoint_v3_v3_get_displays_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDisplaysRequestV3'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    GeneralRecommendRequest:
      properties:
        tenant:
          type: string
          title: Tenant
          description: Identifier associated with the API integration
        market:
          type: string
          title: Market
          description: Market identifier
        locale:
          anyOf:
          - type: string
          - type: 'null'
          title: Locale
          description: Locale identifier
        type:
          type: string
          title: Type
          description: Type of the recommendation, e.g. `cross_sell`
        limit:
          anyOf:
          - type: integer
            maximum: 128.0
            minimum: 1.0
          - type: 'null'
          title: Limit
          description: Maximum number of recommendations returned.
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
          description: Customer identifier
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: Session identifier
        dsid:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Dsid
          description: Populated for integrations performed by Depict.ai only. Depict.ai Session Id
        document_referrer:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Referrer
        metadata:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Metadata
          description: Metadata that can be used to modify the behaviour of the recommendation system
      type: object
      required:
      - tenant
      - market
      - type
      title: GeneralRecommendRequest
    CategoryRecommendRequest:
      properties:
        tenant:
          type: string
          title: Tenant
          description: Identifier associated with the API integration
        market:
          type: string
          title: Market
          description: Market identifier
        locale:
          anyOf:
          - type: string
          - type: 'null'
          title: Locale
